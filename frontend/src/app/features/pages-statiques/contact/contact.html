<section class="page">
    <app-page-header heading="Contact" subtitle="Une question, une erreur dans une fiche, une idée ? Écris-nous."
        [crumbs]="[{ label: 'Accueil', link: '/' }, { label: 'Contact' }]" />

    <form class="card contact-form" (submit)="submit($event)" novalidate>
        <div class="field">
            <label for="c-nom">Nom</label>
            <input id="c-nom" type="text" autocomplete="name" [value]="nom()" (input)="nom.set($any($event.target).value)"
                [attr.aria-invalid]="errors().nom ? 'true' : null" aria-describedby="err-c-nom" />
            @if (errors().nom) { <p id="err-c-nom" class="error" role="alert">{{ errors().nom }}</p> }
        </div>

        <div class="field">
            <label for="c-email">Adresse e-mail</label>
            <input id="c-email" type="email" autocomplete="email" [value]="email()"
                (input)="email.set($any($event.target).value)" [attr.aria-invalid]="errors().email ? 'true' : null"
                aria-describedby="err-c-email" />
            @if (errors().email) { <p id="err-c-email" class="error" role="alert">{{ errors().email }}</p> }
        </div>

        <div class="field">
            <label for="c-message">Message</label>
            <textarea id="c-message" [value]="message()" (input)="message.set($any($event.target).value)"
                [attr.aria-invalid]="errors().message ? 'true' : null" aria-describedby="err-c-message"></textarea>
            @if (errors().message) { <p id="err-c-message" class="error" role="alert">{{ errors().message }}</p> }
        </div>

        <button type="submit" class="btn" [disabled]="loading()">
            @if (loading()) { <span class="spinner" aria-hidden="true"></span> }
            Envoyer
        </button>

        <div aria-live="polite">
            @if (sent()) { <p class="feedback" role="status">Merci ! Ton message a bien été envoyé (simulation).</p> }
        </div>
    </form>
</section>
