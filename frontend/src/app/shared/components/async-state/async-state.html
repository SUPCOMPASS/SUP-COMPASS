@switch (status()) {
  @case ('ready') {
    <ng-content />
  }
  @case ('error') {
    <div class="card async-error" role="alert">
      <h2 class="async-title">Impossible de charger les données</h2>
      <p>{{ error() || 'Une erreur est survenue.' }}</p>
      <button type="button" class="btn btn-outline" (click)="retry.emit()">Réessayer</button>
    </div>
  }
  @default {
    <app-loader [variant]="variant()" [label]="label()" [lines]="lines()" />
  }
}
