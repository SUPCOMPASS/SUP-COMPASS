@if (steps().length) {
<ol class="timeline">
    @for (step of steps(); track step.id) {
    <li class="card">
        <span class="year" aria-hidden="true">{{ step.annee }}</span>
        <div>
            <h3><span class="sr-only">{{ step.annee }} : </span>{{ step.titre }}</h3>
            <ul class="plain-list">
                @for (item of step.contenu; track item) {
                <li>{{ item }}</li>
                }
            </ul>
        </div>
    </li>
    }
</ol>
} @else {
<app-empty-state heading="Roadmap à venir" message="Le parcours détaillé de cette fiche n’est pas encore renseigné." />
}
